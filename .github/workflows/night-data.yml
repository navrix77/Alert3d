name: Нічний знімок журналу (для аналізу)
# Ручний запуск: забирає ПУБЛІЧНІ дані сайту (журнал повідомлень каналів, самоперевірку, мапу доби, журнал прогнозів)
# і кладе їх окремим комітом у службову гілку night-data. Хмарні сесії аналізу не мають прямого доступу до сайту,
# а гілку з GitHub можуть забрати. main не змінюється; ключів не потрібно (лише вбудований GITHUB_TOKEN).
on:
  # щодня о 06:07 UTC (08:07 Київ), до щоденного самоаналізу о 09:37: аналіз не залежить від ПК користувача
  schedule: [{ cron: '7 6 * * *' }]
  workflow_dispatch:
    inputs:
      hours: { description: "Скільки годин журналу", default: "72" }
permissions:
  contents: write
concurrency: { group: night-data, cancel-in-progress: false }
jobs:
  snap:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 1 }
      - name: Знімок публічних адрес
        shell: bash
        env: { H: "${{ github.event.inputs.hours || '72' }}", AK: "${{ secrets.ANALYTICS_KEY }}" }
        run: |
          mkdir -p /tmp/snap
          U=https://sky.navryx.com.ua
          for p in selfcheck daily fusion; do curl -s --retry 4 --retry-connrefused --retry-delay 30 --max-time 120 "$U/api/$p" -o /tmp/snap/$p.json; done
          # лічильник відвідувань: лише агреговані числа по днях (без IP і хешів), публічна адреса /api/visits
          curl -s --retry 4 --retry-connrefused --retry-delay 30 --max-time 60 "$U/api/visits?days=60" -o /tmp/snap/visits.json
          # журнал: API віддає щонайбільше 5000 найновіших, тож беремо ще й вибірки за видом
          curl -s --retry 4 --retry-connrefused --retry-delay 30 --max-time 120 "$U/api/journal?hours=$H&limit=5000&key=$AK" -o /tmp/snap/journal.json
          for k in track zone close filtered avia; do curl -s --retry 4 --retry-connrefused --retry-delay 30 --max-time 120 "$U/api/journal?hours=$H&limit=5000&kind=$k&key=$AK" -o /tmp/snap/journal_$k.json; done
          # повідомлення за кожним каналом окремо: ліміт 5000 на запит, а за масовану добу лише track більше (07.11: track лише за 11 год із 72)
          mkdir -p /tmp/snap/src
          python3 -c "import json,glob;print('\n'.join(sorted({i['src'] for f in glob.glob('/tmp/snap/journal*.json') for i in json.load(open(f)).get('items',[])})))" > /tmp/srcs.txt || true
          while read -r s; do [ -n "$s" ] && curl -s --retry 4 --retry-connrefused --retry-delay 30 --max-time 60 -G "$U/api/journal" --data-urlencode "src=$s" --data-urlencode "key=$AK" -d "hours=$H" -d limit=5000 -o "/tmp/snap/src/$s.json"; done < /tmp/srcs.txt
          cp scripts/journal_archive.py /tmp/journal_archive.py  # архів по днях: скрипт із main, бо далі перемикаємось на night-data
          date -u +%FT%TZ > /tmp/snap/taken.txt
          ls -la /tmp/snap
      - name: Коміт у гілку night-data
        shell: bash
        run: |
          git config user.name "sky-night-bot"
          git config user.email "actions@users.noreply.github.com"
          if git ls-remote --exit-code origin night-data >/dev/null; then
            git fetch --depth 1 origin night-data && git checkout -B night-data FETCH_HEAD
          else
            git checkout --orphan night-data && git rm -rq . && git clean -fdq
          fi
          find . -maxdepth 1 -name '*.json' -delete; rm -rf taken.txt src
          cp -r /tmp/snap/* .
          # 12.11: повний журнал накопичується по днях (archive/РРРР-ММ-ДД.json.gz, 45 днів) — для перевірки трекінгу на тижнях даних
          python3 /tmp/journal_archive.py /tmp/snap archive 45 || echo "архів не оновлено"
          git add -A .
          git commit -qm "Знімок журналу $(cat taken.txt)" || echo "без змін"
          git push origin night-data
