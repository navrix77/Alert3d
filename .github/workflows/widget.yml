name: Windows-віджет (NAVRYX SKY)
on:
  push:
    branches: [main]
    paths: ['widget/**', '.github/workflows/widget.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency: { group: widget, cancel-in-progress: true }
jobs:
  build:
    runs-on: windows-latest
    defaults: { run: { working-directory: widget, shell: bash } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: widget/src-tauri }
      - run: npm ci
      - name: Іконки
        run: npx tauri icon ../capacitor/assets/icon-only.png
      - name: Версія
        run: |
          sed -i 's/"version": "1.0.0"/"version": "1.0.${{ github.run_number }}"/' src-tauri/tauri.conf.json
          grep '"version"' src-tauri/tauri.conf.json
      - name: Збірка інсталятора
        run: npx tauri build
      - name: Файл інсталятора
        run: |
          f=$(ls src-tauri/target/release/bundle/nsis/*.exe | head -1)
          cp "$f" NAVRYX-SKY-Widget-Setup.exe
          ls -la NAVRYX-SKY-Widget-Setup.exe
      - uses: actions/upload-artifact@v4
        with: { name: navryx-sky-widget, path: widget/NAVRYX-SKY-Widget-Setup.exe }
      - name: Публікую як «widget-latest»
        uses: softprops/action-gh-release@v2
        with:
          tag_name: widget-latest
          name: NAVRYX SKY — віджет для Windows (остання збірка)
          prerelease: false
          make_latest: false
          files: widget/NAVRYX-SKY-Widget-Setup.exe
          body: |
            Віджет NAVRYX SKY для Windows 10/11 (1.0.${{ github.run_number }}): маленьке вікно з вашим станом поверх усіх програм,
            значок у треї, автозапуск разом з Windows. Завантажте NAVRYX-SKY-Widget-Setup.exe і запустіть.
