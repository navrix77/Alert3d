name: Знімок стану SKY (діагностика)
# Ручний запуск: зберігає публічні дані сайту (/api/state тощо) як артефакт, щоб розібрати конкретну ситуацію на мапі.
# Лише читання публічних адрес; ключів не потрібно.
on:
  workflow_dispatch:
    inputs:
      paths: { description: "Адреси через пробіл", default: "/api/state /api/history?hours=1" }
permissions:
  contents: read
jobs:
  peek:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - shell: bash
        env: { P: "${{ github.event.inputs.paths }}" }
        run: |
          mkdir -p out; i=0
          for p in $P; do i=$((i+1)); curl -s --max-time 60 "https://sky.navryx.com.ua$p" -o "out/$i.json"; echo "$p -> $(wc -c < out/$i.json)"; [ "$(wc -c < out/$i.json)" -lt 4000 ] && { echo "BODY: $(cat out/$i.json)"; } || true; done
      - shell: bash
        run: |
          for f in out/*.json; do python3 - "$f" <<'PY' || true
          import json,sys
          d=json.load(open(sys.argv[1]))
          if isinstance(d,dict) and 'accepted_n' in d:
              import time as _t
              print('SA last', d.get('last'), 'ago_h', round((_t.time()-(d.get('last') or 0))/3600,1), 'acc', d['accepted_n'], 'rej', d['rejected_n'])
              for a in d['accepted']: print('ACC', json.dumps(a,ensure_ascii=False)[:300])
              for c in (d.get('checked') or [])[:40]: print('CHK', json.dumps(c,ensure_ascii=False)[:300])
              for k,v in d['rejected_recent']: print('REJ', k, json.dumps(v,ensure_ascii=False)[:250])
          def near(t): return t.get('lat') and 49.5<t['lat']<50.5 and 36.0<t['lon']<37.6
          print('TOP', type(d).__name__, list(d.keys())[:20] if isinstance(d,dict) else len(d))
          if isinstance(d,dict) and isinstance(d.get('frames'),list):
              print('FR0', len(d['frames']), json.dumps(d['frames'][-1]['tracks'][:1],ensure_ascii=False)[:1500] if d['frames'] else '')
              seen={}
              for f in d['frames']:
                  for t in f.get('tracks',[]):
                      if near(t) and t.get('type') in ('jet','shahed'):
                          k=(t['id'],t.get('type'),t.get('count'))
                          if k not in seen: seen[k]=(f['t'],t)
              for (i,ty,c),(ft,t) in sorted(seen.items(),key=lambda x:x[1][0]):
                  print('F', ft, json.dumps({k:t.get(k) for k in ('id','type','count','lat','lon','next','ev')},ensure_ascii=False)[:700])
          if isinstance(d,dict) and isinstance(d.get('tracks'),list):
              for t in d['tracks']:
                  if near(t) or (t.get('count') or 0)>=8: print('N', json.dumps({k:t.get(k) for k in ('id','type','raw_type','count','status','srcs','name','lat','lon','first','last','route_names','ev')},ensure_ascii=False)[:1500])
          items=d.get('tracks') if isinstance(d,dict) else d
          if isinstance(d,dict) and 'tracks' not in d:
              for k,v in d.items():
                  if isinstance(v,list):
                      for t in v:
                          if isinstance(t,dict) and near(t): print('H',k,json.dumps(t,ensure_ascii=False)[:900])
          if isinstance(d,dict) and 'tracks' in d:
              print('KEYS', sorted(d['tracks'][0].keys()) if d['tracks'] else [])
              for t in d['tracks']:
                  if t.get('status')=='active' and near(t): print('K', json.dumps({k:t.get(k) for k in ('id','type','count','lat','lon','hd','hd_src','from','entry','trail','route_names','next','pred','pos_est','likely','launch')},ensure_ascii=False)[:1500])
                  if t.get('status')!='active': continue
                  print('TRK', json.dumps({k:t.get(k) for k in ('id','type','count','status','srcs','dest','to','name','label','lat','lon','est','merged','why')},ensure_ascii=False)[:600])
          PY
          done
      - uses: actions/upload-artifact@v4
        with: { name: peek, path: out, retention-days: 2 }
