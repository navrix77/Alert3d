name: Android APK (NAVRYX SKY)
on:
  push:
    branches: [main]
    paths: ['capacitor/**', '.github/workflows/android.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency: { group: android, cancel-in-progress: true }
jobs:
  build:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: capacitor } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - run: npm ci
      - run: npx cap add android
      - name: Іконки й заставка
        run: npm run assets
      - name: Дозволи, версія
        run: |
          M=android/app/src/main/AndroidManifest.xml
          sed -i 's#<uses-permission android:name="android.permission.INTERNET" />#&\n    <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />\n    <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />\n    <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />\n    <uses-permission android:name="android.permission.VIBRATE" />\n    <uses-permission android:name="android.permission.WAKE_LOCK" />#' $M
          grep -c "ACCESS_FINE_LOCATION" $M
          G=android/app/build.gradle
          sed -i "s/versionCode [0-9]*/versionCode ${{ github.run_number }}/; s/versionName \"[^\"]*\"/versionName \"1.0.${{ github.run_number }}\"/" $G
          grep -E "versionCode|versionName" $G
      - run: npx cap sync android
      - name: Ключ підпису (стабільний, щоб оновлення ставились поверх)
        env: { KS: '${{ secrets.ANDROID_KEYSTORE_B64 }}' }
        run: |
          mkdir -p ~/.android
          if [ -n "$KS" ]; then echo "$KS" | base64 -d > ~/.android/debug.keystore; else cp dev.keystore ~/.android/debug.keystore; fi
      - name: Збірка APK
        working-directory: capacitor/android
        run: chmod +x gradlew && ./gradlew --no-daemon assembleDebug
      - run: cp android/app/build/outputs/apk/debug/app-debug.apk navryx-sky.apk && ls -la navryx-sky.apk
      - uses: actions/upload-artifact@v4
        with: { name: navryx-sky-apk, path: capacitor/navryx-sky.apk }
      - name: Публікую як «android-latest» (постійне посилання для телефона)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-latest
          name: NAVRYX SKY для Android (остання збірка)
          prerelease: true
          files: capacitor/navryx-sky.apk
          body: |
            Остання збірка застосунку NAVRYX SKY для Android (1.0.${{ github.run_number }}).
            Завантажте navryx-sky.apk на телефоні й відкрийте; дозвольте встановлення з цього джерела.
