name: Ключі → сервер (зашифровано)
# Власник: Settings → Secrets and variables → Actions → New repository secret
#   Name: SKY_ENV   Secret: увесь вміст .env.local
# Потім: Actions → «Ключі → сервер (зашифровано)» → Run workflow.
# Дія бере ПУБЛІЧНИЙ ключ сервера, шифрує SKY_ENV і кладе в репозиторій лише шифр secrets/env.enc.
# Розшифрувати його може тільки сервер sky.navryx.com.ua (приватний ключ є лише на ньому).
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install -q "cryptography>=42"
      - name: Шифрую ключі публічним ключем сервера
        env:
          SKY_ENV: ${{ secrets.SKY_ENV }}
          GOOGLE_TTS_KEY: ${{ secrets.GOOGLE_TTS_KEY }}
        run: |
          # окремий секрет GOOGLE_TTS_KEY дописується до SKY_ENV (сервер лише додає/оновлює змінні, решту не чіпає)
          if [ -n "$GOOGLE_TTS_KEY" ]; then SKY_ENV="$(printf '%s\nGOOGLE_TTS_KEY=%s\n' "$SKY_ENV" "$GOOGLE_TTS_KEY")"; export SKY_ENV; fi
          test -n "$SKY_ENV" || { echo "Немає секрету SKY_ENV чи GOOGLE_TTS_KEY"; exit 1; }
          curl -sf https://sky.navryx.com.ua/api/admin/envkey -o pub.pem
          grep -q "BEGIN PUBLIC KEY" pub.pem
          mkdir -p secrets
          python - <<'PY'
          import os, sys
          sys.path.insert(0, ".")
          from app.secrets_sync import encrypt, parse_env
          pem = open("pub.pem").read()
          env = os.environ["SKY_ENV"]
          print("Змінні (лише назви):", ", ".join(sorted(parse_env(env))))
          open("secrets/env.enc", "w").write(encrypt(pem, env))
          PY
          rm -f pub.pem
      - name: Кладу шифр у репозиторій (сервер підхопить за ~5 хв)
        run: |
          git config user.name "sky-keys-bot"
          git config user.email "actions@users.noreply.github.com"
          git add secrets/env.enc
          git commit -m "Ключі для сервера (зашифровано публічним ключем сервера)" || echo "без змін"
          git push
