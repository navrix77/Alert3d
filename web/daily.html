<head>

<style>
:root{--fg:#F2F5FA;--mute:#9AA4B6;--glass:rgba(12,15,22,.72);--rim:rgba(255,255,255,.12)}
html,body{margin:0;height:100%;background:#05070B;color:var(--fg);font-family:Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
#map{position:fixed;inset:0}
.panel{position:fixed;z-index:3;background:var(--glass);border:1px solid var(--rim);border-radius:18px;-webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px);box-shadow:0 14px 40px rgba(0,0,0,.45)}
.head{left:16px;top:16px;padding:14px 18px;max-width:min(560px,calc(100% - 32px))}
.head h1{margin:0;font-size:22px;line-height:1.15;font-weight:800;letter-spacing:-.01em;text-transform:uppercase}
.head .sub{margin-top:4px;color:var(--mute);font-weight:700;font-size:13px;letter-spacing:.04em;text-transform:uppercase}
.head .nav{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap}
.head{padding-right:58px!important}.head .x{position:absolute;right:10px;top:10px;width:38px;height:38px;border-radius:50%;padding:0;font-size:16px;background:rgba(255,255,255,.14)}
.sm{display:none}.credit{display:none;font-size:9.5px;color:var(--mute);margin-top:3px}
button{border:0;border-radius:11px;padding:7px 11px;font:600 13px inherit;font-family:inherit;color:var(--fg);background:rgba(255,255,255,.1);cursor:pointer}
button:hover{background:rgba(255,255,255,.18)}button:disabled{opacity:.35;cursor:default}
.legend{left:16px;bottom:16px;padding:12px 14px;min-width:230px}
.legend .r{display:flex;align-items:center;gap:10px;margin:5px 0;font-weight:700;font-size:13px}
.legend .r i{width:26px;height:4px;border-radius:3px;box-shadow:0 0 8px currentColor}
.legend .r b{margin-left:auto;font-variant-numeric:tabular-nums}
.legend .r.t{cursor:pointer;border-radius:8px;padding:2px 4px;margin:2px -4px;transition:opacity .2s,background .2s}.legend .r.t:hover{background:rgba(255,255,255,.07)}
.legend .r.off{opacity:.35}.legend .r.on{background:rgba(255,255,255,.12)}.legend .r.maj{font-weight:800}.legend .r:not(.maj) i{opacity:.6;box-shadow:none}
.legend small.hint{color:#C9D2E3;font-weight:600}
.legend .grp{display:flex;gap:4px;margin:0 0 8px;padding:3px;background:rgba(255,255,255,.06);border-radius:12px;grid-column:1/-1}
.legend .grp button{flex:1;padding:6px 8px;border-radius:9px;background:transparent;font-size:12.5px;color:var(--mute)}.legend .grp button.on{background:rgba(255,255,255,.16);color:#fff}
.legend small{display:block;color:var(--mute);font-size:11px;font-weight:500;margin-top:6px;max-width:260px;line-height:1.35}
.stats{right:16px;top:16px;padding:12px 14px;max-width:300px;font-size:13px}
.stats h3{margin:0 0 6px;font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--mute)}
.stats .big{font-size:26px;font-weight:800}
.stats ul{list-style:none;margin:6px 0 0;padding:0;max-height:34vh;overflow:auto}.stats li{display:flex;justify-content:space-between;gap:10px;padding:2px 0}
.play{right:16px;bottom:16px;padding:10px 12px;display:flex;align-items:center;gap:10px;width:min(420px,calc(100% - 32px));box-sizing:border-box}
.play input{flex:1;accent-color:#FFB020}.play #spd{white-space:nowrap;font-variant-numeric:tabular-nums;min-width:72px}.play span{font-variant-numeric:tabular-nums;font-weight:700;min-width:44px;text-align:right}
.wm{position:fixed;z-index:2;right:18px;bottom:76px;color:rgba(255,255,255,.55);font-weight:800;font-size:15px;pointer-events:none}
.loading[hidden]{display:none}.loading{position:fixed;inset:0;display:grid;place-items:center;z-index:5;background:rgba(5,7,11,.6);font-weight:700}
@media (max-width:700px){
  .head{left:10px;right:10px;top:max(10px,env(safe-area-inset-top));max-width:none;padding:10px 12px;border-radius:16px}
  .head h1{font-size:15px}.head .sub{font-size:11px;margin-top:2px}
  .head .nav{gap:5px;margin-top:8px;flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none}.head .nav::-webkit-scrollbar{display:none}.head .nav button{padding:6px 9px;font-size:12px;white-space:nowrap;flex:none}
  .stats{top:auto;left:10px;right:10px;bottom:calc(64px + env(safe-area-inset-bottom));max-width:none;padding:8px 12px;display:flex;align-items:center;gap:10px;border-radius:14px}
  .stats h3{margin:0;font-size:10px}.stats .big{font-size:20px}.stats ul,.stats .bh{display:none}.stats>div:not(.big){font-size:12px;line-height:1.2}
  .legend{left:10px;right:10px;bottom:calc(118px + env(safe-area-inset-bottom));min-width:0;padding:8px 12px;display:grid;grid-template-columns:1fr 1fr;column-gap:14px;border-radius:14px}
  .legend .r{margin:1px -4px;font-size:12px;gap:7px}.legend .r i{width:18px}.legend small{display:none}.legend small.hint{display:block;grid-column:1/-1;font-size:11px;margin-top:4px}
  .play{left:10px;right:10px;bottom:max(10px,env(safe-area-inset-bottom));width:auto;padding:8px 10px;border-radius:14px}
  .maplibregl-ctrl-bottom-right,.maplibregl-ctrl-bottom-left{display:none}.credit{display:block}
  .wm{display:none}.lg{display:none}.sm{display:inline}.head .x{width:34px;height:34px;right:8px;top:8px}
}
</style>
</head>

<div id="map"></div>
<div class="panel head"><button id="back" class="x" aria-label="Закрити й повернутися до карти" title="До карти">✕</button><h1>Мапа маршрутів БпЛА та ракет</h1><div class="sub" id="sub">…</div><div class="credit">© Esri, Maxar · © OpenStreetMap · OpenFreeMap</div>
  <div class="nav"><button id="prev">◀ <span class="lg">Попередня доба</span><span class="sm">Попередня</span></button><button id="next"><span class="lg">Наступна</span><span class="sm">Наступна</span> ▶</button><button id="png">⤓ <span class="lg">Зберегти зображення</span><span class="sm">Зберегти</span></button></div></div>

<script src="https://unpkg.com/maplibre-gl@5.1.0/dist/maplibre-gl.js"></script>
<script>
'use strict';
const T={lancet:['«Ланцети»','#FFC43C'],shahed:['Шахеди / Герані','#FFA31A'],jet:['Реактивні БпЛА','#FF2BD6'],molniya:['«Молнії»','#7CFF2A'],cruise:['Крилаті ракети','#9D3CFF'],ballistic:['Балістичні ракети','#FF2E2E'],kab:['КАБи','#22E1FF'],geran5:['«Герань-5»','#FF5FA2'],banderol:['«Бандеролі»','#C08CFF'],rszv:['РСЗВ','#FF7A2E'],fpv:['FPV-дрони','#FF4D6D'],fpvf:['FPV на оптоволокні','#3DA5FF'],recon:['Дрони-розвідники','#2EE6A8']};
const $=s=>document.querySelector(s);
const q=new URLSearchParams(location.search);let DAY=q.get('d')||null,D=null,CUR=1,playing=false;
const ESRI='https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}';
const map=new maplibregl.Map({container:'map',center:[31.6,48.6],zoom:mobile()?4.6:5.55,attributionControl:{compact:true},canvasContextAttributes:{preserveDrawingBuffer:true},
  style:{version:8,glyphs:'https://tiles.openfreemap.org/fonts/{fontstack}/{range}.pbf',sources:{esri:{type:'raster',tiles:[ESRI],tileSize:256,maxzoom:12,attribution:'© Esri, Maxar · © OpenStreetMap · дані: Telegram-монітори, ПС ЗСУ'}},
    layers:[{id:'bg',type:'background',paint:{'background-color':'#05070B'}},{id:'esri',type:'raster',source:'esri',paint:{'raster-saturation':-1,'raster-brightness-max':0.34,'raster-contrast':0.25}}]}});
function mobile(){return innerWidth<700;}
const MON=['січня','лютого','березня','квітня','травня','червня','липня','серпня','вересня','жовтня','листопада','грудня'];
const fd=t=>{const d=new Date(t*1000);return d.getDate()+' '+MON[d.getMonth()];};
const hm=t=>new Date(t*1000).toLocaleTimeString('uk-UA',{hour:'2-digit',minute:'2-digit'});
// плавна крива через точки (Catmull-Rom), маршрут виглядає як політ, а не ламана
function smoothPts(p){if(p.length<3)return p.map(x=>[x[0],x[1]]);const o=[];
  for(let i=0;i<p.length-1;i++){const a=p[Math.max(0,i-1)],b=p[i],c=p[i+1],d=p[Math.min(p.length-1,i+2)];
    const n=Math.max(2,Math.min(8,Math.round(Math.hypot(c[0]-b[0],c[1]-b[1])*20)));
    for(let k=0;k<n;k++){const t=k/n,t2=t*t,t3=t2*t;o.push([0,1].map(j=>0.5*((2*b[j])+(-a[j]+c[j])*t+(2*a[j]-5*b[j]+4*c[j]-d[j])*t2+(-a[j]+3*b[j]-3*c[j]+d[j])*t3)));}}
  o.push([p[p.length-1][0],p[p.length-1][1]]);return o;}
function flame(){const c=document.createElement('canvas'),s=64;c.width=c.height=s;const g=c.getContext('2d');
  const r=g.createRadialGradient(32,40,2,32,38,26);r.addColorStop(0,'rgba(255,250,210,1)');r.addColorStop(.35,'rgba(255,170,40,.95)');r.addColorStop(.7,'rgba(230,60,20,.6)');r.addColorStop(1,'rgba(200,20,10,0)');
  g.fillStyle=r;g.beginPath();g.moveTo(32,4);g.bezierCurveTo(44,18,54,28,52,42);g.bezierCurveTo(50,56,40,62,32,62);g.bezierCurveTo(24,62,14,56,12,42);g.bezierCurveTo(10,30,22,24,26,12);g.bezierCurveTo(28,20,30,24,32,26);g.bezierCurveTo(30,18,30,10,32,4);g.fill();
  return g.getImageData(0,0,s,s);}
map.on('load',async()=>{
  map.addImage('flame',flame(),{pixelRatio:2});
  for(const [id,url] of [['obl','/data/oblasts.geojson'],['occ','/data/occupied.geojson']])map.addSource(id,{type:'geojson',data:url});
  map.addLayer({id:'occ',type:'fill',source:'occ',paint:{'fill-color':'#7A2A36','fill-opacity':0.45}});
  map.addLayer({id:'obl',type:'line',source:'obl',paint:{'line-color':'rgba(255,255,255,.28)','line-width':0.8}});
  map.addSource('tr',{type:'geojson',lineMetrics:true,data:{type:'FeatureCollection',features:[]}});
  map.addImage('chev',chev(),{pixelRatio:2,sdf:true});
  for(const k of Object.keys(T)){const c=T[k][1];
    map.addLayer({id:'trg-'+k,type:'line',source:'tr',filter:['all',['==',['get','k'],k],['==',['get','g'],1]],layout:{'line-cap':'round','line-join':'round'},
      paint:{'line-width':7,'line-blur':6,'line-gradient':['interpolate',['linear'],['line-progress'],0,'rgba(0,0,0,0)',1,hexA(c,.35)]}});
    map.addLayer({id:'tr-'+k,type:'line',source:'tr',filter:['==',['get','k'],k],layout:{'line-cap':'round','line-join':'round','line-sort-key':['get','z']},
      paint:{'line-width':['interpolate',['linear'],['zoom'],5,['get','w'],8,['*',1.7,['get','w']]],'line-opacity':['get','o'],
        'line-gradient':['interpolate',['linear'],['line-progress'],0,hexA(c,0),0.55,hexA(c,.55),1,c]}});}
  // звідки летіло: дуга від місця пуску до першої фіксації, росте в реальному часі польоту; пуск спалахує кільцем
  map.addSource('links',{type:'geojson',data:{type:'FeatureCollection',features:[]}});
  map.addLayer({id:'links-glow',type:'line',source:'links',layout:{'line-cap':'round'},paint:{'line-color':['get','c'],'line-width':6,'line-blur':5,'line-opacity':['*',0.35,['get','a']]}});
  map.addLayer({id:'links',type:'line',source:'links',layout:{'line-cap':'round'},paint:{'line-color':['get','c'],'line-width':['get','w'],'line-opacity':['get','a'],'line-dasharray':[2,1.5]}});
  map.addSource('lhead',{type:'geojson',data:{type:'FeatureCollection',features:[]}});
  map.addLayer({id:'lhead-glow',type:'circle',source:'lhead',paint:{'circle-radius':12,'circle-color':['get','c'],'circle-blur':1,'circle-opacity':0.7}});
  map.addLayer({id:'lhead',type:'circle',source:'lhead',paint:{'circle-radius':2.6,'circle-color':'#fff'}});
  map.addSource('spulse',{type:'geojson',data:{type:'FeatureCollection',features:[]}});
  map.addLayer({id:'spulse',type:'circle',source:'spulse',paint:{'circle-radius':['get','r'],'circle-color':'rgba(255,80,70,.12)','circle-opacity':['get','a'],'circle-stroke-color':'#FF5A4E','circle-stroke-width':2,'circle-stroke-opacity':['get','a']}});
  map.addSource('arr',{type:'geojson',data:{type:'FeatureCollection',features:[]}});
  map.addLayer({id:'arr',type:'symbol',source:'arr',layout:{'icon-image':'chev','icon-size':['case',['==',['get','g'],1],0.55,0.36],'icon-rotate':['get','b'],'icon-rotation-alignment':'map','icon-allow-overlap':true,'icon-ignore-placement':true},
    paint:{'icon-color':['get','c'],'icon-opacity':['get','o']}});
  map.addSource('heads',{type:'geojson',data:{type:'FeatureCollection',features:[]}});
  map.addLayer({id:'heads',type:'circle',source:'heads',paint:{'circle-radius':['case',['==',['get','g'],1],3.6,2],'circle-color':'#fff','circle-stroke-color':['get','c'],'circle-stroke-width':['case',['==',['get','g'],1],2.2,1.2],'circle-opacity':['case',['==',['get','g'],1],1,0.7],'circle-stroke-opacity':['case',['==',['get','g'],1],1,0.7]}});
  map.addLayer({id:'heads-glow',type:'circle',source:'heads',filter:['==',['get','g'],1],paint:{'circle-radius':11,'circle-color':['get','c'],'circle-blur':1,'circle-opacity':0.55}},'heads');
  map.addSource('sites',{type:'geojson',data:{type:'FeatureCollection',features:[]}});
  map.addLayer({id:'sites',type:'circle',source:'sites',paint:{'circle-radius':['+',6,['*',2,['sqrt',['get','c']]]],'circle-color':'rgba(255,60,70,.25)','circle-stroke-color':'#FF4D57','circle-stroke-width':1.6}});
  map.addLayer({id:'sites-t',type:'symbol',source:'sites',layout:{'text-field':['concat','🚀 ',['get','n'],' ×',['to-string',['get','c']]],'text-font':['Noto Sans Bold'],'text-size':12,'text-offset':[0,1.4],'text-anchor':'top'},paint:{'text-color':'#FFB3B8','text-halo-color':'#000','text-halo-width':1.6}});
  map.addSource('booms',{type:'geojson',data:{type:'FeatureCollection',features:[]}});
  map.addLayer({id:'booms',type:'symbol',source:'booms',layout:{'icon-image':'flame','icon-size':['*',['interpolate',['linear'],['get','c'],1,0.6,10,1.05],['+',0.55,['*',0.45,['get','a']]]],'icon-allow-overlap':true,'text-field':['get','n'],'text-font':['Noto Sans Bold'],'text-size':11.5,'text-offset':[0,1.5],'text-anchor':'top','text-optional':true},paint:{'icon-opacity':['get','a'],'text-color':'rgba(255,255,255,.75)','text-halo-color':'#000','text-halo-width':1.4,'text-opacity':['interpolate',['linear'],['get','a'],0.4,0.7,1,1]}});
  map.addSource('omt',{type:'vector',url:'https://tiles.openfreemap.org/planet'});
  map.addLayer({id:'cities',type:'symbol',source:'omt','source-layer':'place',filter:['any',['==',['get','class'],'city'],['all',['==',['get','class'],'town'],['>=',['zoom'],7]]],
    layout:{'text-field':['coalesce',['get','name:uk'],['get','name']],'text-font':['Noto Sans Bold'],'text-size':['match',['get','class'],'city',13,11]},paint:{'text-color':'rgba(235,240,248,.92)','text-halo-color':'rgba(0,0,0,.85)','text-halo-width':1.4}});
  await load(DAY);
});
async function load(day){
  if(!D||D.day!==day)$('#ld').hidden=false;
  for(let i=0;i<6;i++){try{const r=await fetch('/api/daily'+(day?'?d='+day:''));D=await r.json();break;}catch(e){$('#ld').textContent='Сервер перезапускається… повторюю';await new Promise(r=>setTimeout(r,4000));}}
  $('#ld').hidden=true;if(!D){$('#sub').textContent='Не вдалося завантажити';return;}
  if(D.error){$('#sub').textContent=D.error;return;}
  DAY=D.day;history.replaceState(null,'','?d='+DAY);
  $('#sub').textContent=fd(D.t0)+' – '+fd(D.t1)+' '+new Date(D.t1*1000).getFullYear()+' · з 09:00 до 09:00'+(D.final?'':' · доба ще триває');
  const SXY={};for(const x of D.sites)SXY[x.n]=[x.lon,x.lat];
  for(const t of D.tracks){const xy=t.lxy||SXY[t.launch];if(xy){const a=t.pts[0];t.arc=arcify([xy,[a[0],a[1]]],0.12);const st=a[2];t.lt0=(t.lt&&t.lt<st)?t.lt:st-1200;}}
  for(const t of D.tracks){t.sp=t.pts.length>2?smoothPts(t.pts):arcify(t.pts,t.type==='ballistic'?0.16:0.08);t.len=plen(t.pts);}
  if(!GRP||load.gd!==DAY){load.gd=DAY;GRP=D.tracks.some(t=>MAJOR.has(t.type)&&t.len>=25)?'miss':'all';SEL=null;}
  legend();stats();
  if(!load.fitted||load.fitted!==DAY){fit();load.fitted=DAY;intro();}else draw(CUR);
  clearTimeout(load.poll);if(D.crawling)load.poll=setTimeout(()=>load(DAY),20000);
  const nx=new Date(new Date(DAY).getTime()+864e5).toISOString().slice(0,10);
  $('#next').disabled=!D.final;$('#next').dataset.d=nx;
  $('#prev').dataset.d=new Date(new Date(DAY).getTime()-864e5).toISOString().slice(0,10);
}
// «вау»-вхід: камера опускається з нахилу на всю країну, а маршрути доби «пролітають» за кілька секунд
function intro(){
  const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
  if(reduce){draw(1);return;}
  const end={center:map.getCenter(),zoom:map.getZoom()};
  map.jumpTo({center:[end.center.lng+1.2,end.center.lat-1.6],zoom:end.zoom-0.7,pitch:58,bearing:-24});
  map.easeTo({center:end.center,zoom:end.zoom,pitch:0,bearing:0,duration:6500,easing:t=>1-Math.pow(1-t,3)});
  // програвання доби, з обраною швидкістю (за замовчуванням 2.5 с на годину), а не за 6 секунд
  CUR=0;draw(0);$('#tt').value=0;playing=false;setTimeout(()=>{if(!playing&&CUR===0)$('#pl').click();},700);
}
function fit(){// уся Україна в кадрі, з урахуванням панелей
  const m=mobile(),hh=document.querySelector('.head').offsetHeight;
  const bot=m?(document.querySelector('.legend').offsetHeight+130):40;
  map.fitBounds([[22.1,44.3],[40.2,52.4]],{padding:{top:hh+(m?20:30),bottom:bot,left:m?6:40,right:m?6:(document.querySelector('.stats').offsetWidth+40)},duration:0});}
addEventListener('resize',()=>{if(D)fit();});
// ієрархія: ракети, КАБи, «Герань-5» яскраво й поверх; масові дрони тонко й напівпрозоро (густина показує коридори)
const MAJOR=new Set(['cruise','ballistic','kab','geran5','banderol','rszv']);let SEL=null,GRP=null;
// режим за замовчуванням: «Ракети», якщо вони були, бо саме вони губилися серед сотень дронів
const GRPS=[['miss','Ракети й КАБи'],['dron','Дрони'],['all','Усе']];
function style(type){const maj=MAJOR.has(type);
  if(SEL)return SEL===type?{g:maj?1:0,w:maj?2.2:1.3,o:0.95,z:3}:null;
  if(GRP==='miss')return maj?{g:1,w:2.3,o:1,z:2}:null;
  if(GRP==='dron')return maj?null:{g:0,w:1,o:0.4,z:1};
  return maj?{g:1,w:2,o:1,z:2}:{g:0,w:0.8,o:0.22,z:1};}
function hexA(h,a){const n=parseInt(h.slice(1),16);return 'rgba('+(n>>16)+','+(n>>8&255)+','+(n&255)+','+a+')';}
function chev(){const c=document.createElement('canvas'),s=48;c.width=c.height=s;const g=c.getContext('2d');g.fillStyle='#fff';
  g.beginPath();g.moveTo(24,4);g.lineTo(42,40);g.lineTo(24,31);g.lineTo(6,40);g.closePath();g.fill();return g.getImageData(0,0,s,s);}
// пряма між двома пунктами виглядає як «паличка»: малюємо пологою дугою (умовність, як на картах авіарейсів)
function arcify(p,k){if(p.length>2)return p;const a=p[0],b=p[p.length-1],dx=b[0]-a[0],dy=b[1]-a[1],o=[];
  for(let i=0;i<=16;i++){const t=i/16,h=Math.sin(Math.PI*t)*k;o.push([a[0]+dx*t-dy*h,a[1]+dy*t+dx*h]);}return o;}
function brg(a,b){return (Math.atan2((b[0]-a[0])*Math.cos(b[1]*Math.PI/180),b[1]-a[1])*180/Math.PI+360)%360;}
function plen(p){let s=0;for(let i=1;i<p.length;i++)s+=Math.hypot((p[i][0]-p[i-1][0])*71.5,(p[i][1]-p[i-1][1])*111.2);return s;}
function draw(f){CUR=f;const T1=D.t0+(Math.min(D.t1,D.built)-D.t0)*f;const F=[],Hd=[],A=[];
  for(const t of D.tracks){const c=(T[t.type]||T.shahed)[1];const st=style(t.type);if(!st)continue;
    if(t.len<(MAJOR.has(t.type)?25:15)&&SEL!==t.type)continue;// уривки: шум, а не маршрут
    let pts=t.sp;if(f<1){const tl=t.pts;if(tl[0][2]>T1)continue;const k=tl.findIndex(p=>p[2]>T1);if(k>0){const frac=(k)/(tl.length);pts=t.sp.slice(0,Math.max(2,Math.round(t.sp.length*frac)));}
      if(k===-1)pts=t.sp;}
    if(pts.length>1){F.push({type:'Feature',properties:{c,k:T[t.type]?t.type:'shahed',...st},geometry:{type:'LineString',coordinates:pts}});
      if(f>=1&&(st.g||SEL===t.type)){const n=pts.length;A.push({type:'Feature',properties:{c,g:st.g,o:st.o,b:brg(pts[n-2],pts[n-1])},geometry:{type:'Point',coordinates:pts[n-1]}});}}
    if(f<1&&t.pts[t.pts.length-1][2]>T1)Hd.push({type:'Feature',properties:{c,g:st.g},geometry:{type:'Point',coordinates:pts[pts.length-1]}});}
  map.getSource('tr').setData({type:'FeatureCollection',features:F});
  map.getSource('heads').setData({type:'FeatureCollection',features:Hd});links(f,T1);map.getSource('arr').setData({type:'FeatureCollection',features:A});
  map.getSource('sites').setData({type:'FeatureCollection',features:D.sites.map(s=>({type:'Feature',properties:{n:s.n,c:s.c},geometry:{type:'Point',coordinates:[s.lon,s.lat]}}))});
  map.getSource('booms').setData({type:'FeatureCollection',features:D.booms.filter(b=>b.t<=T1).map(b=>({type:'Feature',properties:{n:b.n+(b.c>1?' ×'+b.c:''),c:b.c,a:(f<1&&T1-b.t<900)?1:0.42},geometry:{type:'Point',coordinates:[b.lon,b.lat]}}))});
  $('#tl').textContent=f>=1?'усе':hm(T1);}
// дуги «звідки летіло»: під час відтворення ростуть від пуску до першої фіксації (голова-комета), потім гаснуть;
// на повній мапі лишаються ледь видимі, лише для ракет або вибраного типу (сотні шахедів з Курська інакше закриють усе)
function links(f,T1){const L=[],Hh=[],Pu=[],fired={};
  for(const t of D.tracks){if(!t.arc)continue;const st=style(t.type);if(!st)continue;const c=(T[t.type]||T.shahed)[1],s0=t.lt0,e0=t.pts[0][2];
    if(f>=1){if(MAJOR.has(t.type)||SEL===t.type)L.push({type:'Feature',properties:{c,a:0.28,w:1},geometry:{type:'LineString',coordinates:t.arc}});continue;}
    if(T1<s0||T1>e0+1800)continue;
    const fr=Math.min(1,(T1-s0)/Math.max(60,e0-s0)),n=t.arc.length-1,k=fr*n,i=Math.floor(k),q=k-i,a=t.arc[i],b=t.arc[Math.min(n,i+1)],hp=[a[0]+(b[0]-a[0])*q,a[1]+(b[1]-a[1])*q];
    const pts=[...t.arc.slice(0,i+1),hp];const fade=T1>e0?Math.max(0,1-(T1-e0)/1800):1;
    if(pts.length>1)L.push({type:'Feature',properties:{c,a:0.85*fade,w:MAJOR.has(t.type)?1.8:1.1},geometry:{type:'LineString',coordinates:pts}});
    if(fr<1)Hh.push({type:'Feature',properties:{c},geometry:{type:'Point',coordinates:hp}});
    if(T1-s0<1500){const key=t.arc[0].join();if(!fired[key]||fired[key]>T1-s0)fired[key]=T1-s0;}}
  for(const key in fired){const g=fired[key]/1500;Pu.push({type:'Feature',properties:{r:8+g*42,a:Math.max(0,1-g)},geometry:{type:'Point',coordinates:key.split(',').map(Number)}});}
  map.getSource('links').setData({type:'FeatureCollection',features:L});map.getSource('lhead').setData({type:'FeatureCollection',features:Hh});map.getSource('spulse').setData({type:'FeatureCollection',features:Pu});}
function legend(){const cnt={};for(const t of D.tracks)cnt[t.type]=(cnt[t.type]||0)+1;
  const ord=Object.keys(T).filter(k=>cnt[k]&&(GRP==='all'||(GRP==='miss')===MAJOR.has(k))).sort((a,b)=>MAJOR.has(b)-MAJOR.has(a));
  $('#legend').innerHTML='<div class="grp">'+GRPS.map(([k,n])=>'<button data-g="'+k+'"'+(GRP===k?' class="on"':'')+'>'+n+'</button>').join('')+'</div>'+ord.map(k=>'<div class="r t'+(SEL===k?' on':SEL?' off':'')+(MAJOR.has(k)?' maj':'')+'" data-k="'+k+'" role="button" tabindex="0"><i style="background:'+T[k][1]+';color:'+T[k][1]+'"></i>'+T[k][0]+'</div>').join('')+
    '<div class="r"><span style="width:26px;text-align:center">🔥</span>Вибухи'+(D.crawling?' <small style="display:inline;margin:0">· збираю з історії каналів…</small>':'')+'<b>'+D.booms.length+'</b></div><div class="r"><span style="width:26px;text-align:center">🚀</span>Місця пусків<b>'+D.sites.length+'</b></div>'+
    '<small class="hint">'+(SEL?'Показано лише: '+T[SEL][0]+'. Торкніться ще раз, щоб повернути все.':'Торкніться типу, щоб побачити лише його. Лінії умовні: з\'єднують місця, які назвали канали.')+'</small>'+
    '<small>Маршрути відтворено з повідомлень моніторів і приблизні; кількість цілей дивіться в підсумку Повітряних сил. Вибухи, з точністю до населеного пункту.</small>';
  document.querySelectorAll('#legend .grp button').forEach(b=>b.onclick=()=>{GRP=b.dataset.g;SEL=null;legend();draw(CUR);});
  document.querySelectorAll('#legend .r.t').forEach(r=>{r.onclick=()=>{SEL=SEL===r.dataset.k?null:r.dataset.k;legend();draw(CUR);};r.onkeydown=e=>{if(e.key==='Enter')r.onclick();};});}
function stats(){const o=D.official;
  $('#stats').innerHTML=(o?'<h3>Повітряні сили ЗСУ</h3><div class="big">'+o.shot+'</div><div>збито / подавлено за ніч (станом на ранок)</div>':'<h3>Офіційний підсумок</h3><div>Ще не оголошено</div>')+
    (D.booms.length?'<h3 class="bh" style="margin-top:12px">Найбільше вибухів</h3><ul>'+D.booms.slice(0,12).map(b=>'<li><span>'+b.n+'</span><b>'+b.c+'</b></li>').join('')+'</ul>':'');}
$('#tt').oninput=e=>{playing=false;$('#pl').textContent='▶';draw(e.target.value/1000);};
const SPD=[1,2.5,5,10,20,40];let spd=1;try{const r=localStorage.getItem('dspd2');if(r!==null&&+r>=0&&+r<SPD.length)spd=+r;}catch(e){}
const spdLbl=()=>{$('#spd').textContent=SPD[spd]+' с/год';};spdLbl();
$('#spd').onclick=()=>{spd=(spd+1)%SPD.length;spdLbl();try{localStorage.setItem('dspd2',spd);}catch(e){}};
$('#pl').onclick=()=>{playing=!playing;$('#pl').textContent=playing?'❚❚':'▶';if(playing&&CUR>=1)CUR=0;let last=performance.now();
  const step=now=>{if(!playing)return;CUR=Math.min(1,CUR+(now-last)/(SPD[spd]*24*1000));last=now;$('#tt').value=CUR*1000;draw(CUR);if(CUR>=1){playing=false;$('#pl').textContent='▶';return;}requestAnimationFrame(step);};requestAnimationFrame(step);};
$('#prev').onclick=e=>load(e.currentTarget.dataset.d);$('#next').onclick=e=>load(e.currentTarget.dataset.d);
$('#back').onclick=()=>location.href='/';
$('#png').onclick=()=>{const mc=map.getCanvas(),c=document.createElement('canvas');c.width=mc.width;c.height=mc.height;const g=c.getContext('2d'),k=mc.width/innerWidth;g.drawImage(mc,0,0);
  g.fillStyle='#fff';g.font='800 '+Math.round(26*k)+'px Inter,system-ui,sans-serif';g.fillText('МАПА МАРШРУТІВ БПЛА ТА РАКЕТ',24*k,44*k);
  g.fillStyle='#B8C0CE';g.font='700 '+Math.round(15*k)+'px Inter,system-ui,sans-serif';g.fillText($('#sub').textContent.toUpperCase(),24*k,68*k);
  let y=c.height-24*k-(Object.keys(T).length+1)*22*k;const cnt={};for(const t of D.tracks)cnt[t.type]=(cnt[t.type]||0)+1;
  for(const kk of Object.keys(T).filter(x=>cnt[x])){g.fillStyle=T[kk][1];g.fillRect(24*k,y-6*k,26*k,4*k);g.fillStyle='#fff';g.font='700 '+Math.round(14*k)+'px Inter,system-ui,sans-serif';g.fillText(T[kk][0],58*k,y);y+=22*k;}
  g.fillText('🔥 Вибухи за повідомленнями, '+D.booms.length,24*k,y);
  if(D.official){g.font='800 '+Math.round(15*k)+'px Inter,system-ui,sans-serif';g.textAlign='right';g.fillText('ПС ЗСУ: збито/подавлено '+D.official.shot,c.width-24*k,44*k);}
  g.textAlign='right';g.fillStyle='rgba(255,255,255,.6)';g.font='800 '+Math.round(15*k)+'px Inter,system-ui,sans-serif';g.fillText('NAVRYX SKY',c.width-24*k,c.height-24*k);
  const a=document.createElement('a');a.download='tryvoga-doba-'+DAY+'.png';a.href=c.toDataURL('image/png');a.click();};
</script>
